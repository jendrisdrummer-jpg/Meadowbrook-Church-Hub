<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kids Check-in</title>
  <meta name="theme-color" content="#2f7d4f">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/checkin.css">
</head>
<body class="kiosk">
  <header class="k-top">
    <div class="brand"><span class="brand-mark">M</span><div><b data-church>Kids Check-in</b><small data-where></small></div></div>
    <nav class="k-modes" data-modes>
      <button data-mode="in" class="on">Check in</button>
      <button data-mode="out">Check out</button>
      <button data-mode="rooms">Rooms</button>
    </nav>
    <div class="k-status" data-status></div>
    <button class="icon-btn" data-setup title="Station settings">⚙</button>
  </header>
  <main class="k-main" data-main></main>
  <div class="print-area" data-print aria-hidden="true"></div>
  <script type="module" src="/js/checkin.js"></script>
</body>
</html>
