<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meadowbrook Church Hub</title>
  <meta name="theme-color" content="#f3ede4">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/app-icon/180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip-link" href="#main" data-skip>Skip to content</a>
  <div class="shell">
    <aside class="side">
      <div class="brand"><span class="brand-mark">M</span><div><b data-church>Meadowbrook</b><small>Church Hub</small></div></div>
      <label class="field side-campus">Campus<select data-campus></select></label>
      <nav class="nav" data-nav></nav>
      <div class="side-foot">
        <div class="side-user"><div class="me" data-me></div></div>
        <nav class="side-links" data-side-links aria-label="Settings and help"></nav>
      </div>
    </aside>
    <main class="main" id="main" tabindex="-1">
      <div class="topbar"><h1 data-title tabindex="-1"></h1><span class="pill info page-campus hidden" data-campus-tag></span><div class="row" data-actions></div><div data-search></div><div class="bell-wrap" data-bell></div><div class="me me-top" data-me-top></div></div>
      <div class="content" data-content></div>
    </main>
  </div>
  <nav class="bottomnav" data-bottomnav></nav>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
