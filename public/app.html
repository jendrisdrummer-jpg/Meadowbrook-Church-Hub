<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meadowbrook Church Hub</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/app-icon/180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand"><span class="brand-mark">M</span><div><b data-church>Meadowbrook</b><small>Church Hub</small></div></div>
      <nav class="nav" data-nav></nav>
      <div class="side-foot">
        <label class="field">Campus<select data-campus></select></label>
        <div class="me" data-me></div>
      </div>
    </aside>
    <main class="main">
      <div class="topbar"><h1 data-title></h1><div class="row" data-actions></div><div class="bell-wrap" data-bell></div><div class="me me-top" data-me-top></div></div>
      <div class="content" data-content></div>
    </main>
  </div>
  <nav class="bottomnav" data-bottomnav></nav>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
