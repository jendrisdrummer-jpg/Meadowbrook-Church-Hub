<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Can’t reach Meadowbrook</title>
  <style>
    :root { --bg: #ffffff; --fg: #1b2330; --muted: #5b6678; --accent: #135fd1; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #11161f; --fg: #eef1f6; --muted: #9aa5b8; --accent: #5b9bff; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--fg); font: 17px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif; text-align: center; }
    main { max-width: 22rem; }
    .mark { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 18px; background: var(--accent); color: #fff;
      display: grid; place-items: center; font-size: 36px; font-weight: 700; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: var(--muted); }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 14px 28px; min-height: 48px;
      background: var(--accent); color: #fff; width: 100%; }
    button:active { opacity: .85; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">M</div>
    <h1>Can’t reach Meadowbrook right now</h1>
    <p>Check your connection, then try again.</p>
    <button type="button" id="retry">Try again</button>
  </main>
  <script src="church-config.js"></script>
  <script>
    // Per-church name comes from church.config.json (via church-config.js).
    if (window.CHURCH) {
      document.title = 'Can’t reach ' + window.CHURCH.name;
      document.querySelector('h1').textContent = 'Can’t reach ' + window.CHURCH.name.replace(/ Church$/, '') + ' right now';
      document.querySelector('.mark').textContent = window.CHURCH.name.trim()[0].toUpperCase();
    }
    // Try the live app again; if it's still unreachable the shell shows this page again.
    document.getElementById('retry').addEventListener('click', function () {
      location.href = window.CHURCH ? window.CHURCH.hostedUrl : '/';
    });
  </script>
</body>
</html>
